name: Backend browser compatibility

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'server/**'
      - '.agents/skills/verify-where2meet/**'
      - '.github/workflows/backend-compat-ci.yml'

permissions:
  contents: read

concurrency:
  group: browser-compat-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lifecycle:
    name: Browser (${{ matrix.frontend }}, ${{ matrix.scenario }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - frontend: candidate
            scenario: event-lifecycle
          - frontend: fixed
            scenario: event-lifecycle
          - frontend: candidate
            scenario: accounts
    env:
      FRONTEND_CASE: ${{ matrix.frontend }}
      BROWSER_SCENARIO: ${{ matrix.scenario }}
      FIXED_FRONTEND_SHA: 05e6daa2245e31dfd142768b545b74cdb9a51476
    steps:
      - name: Set browser run directory
        run: echo "RUN_DIR=$RUNNER_TEMP/where2meet-browser-$FRONTEND_CASE-$BROWSER_SCENARIO" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select and verify frontend checkout
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          FRONTEND_REPO="$GITHUB_WORKSPACE"
          EXPECTED_FRONTEND_SHA="$GITHUB_SHA"
          if [ "$FRONTEND_CASE" = fixed ]; then
            if ! git rev-parse --verify "$FIXED_FRONTEND_SHA^{commit}" >/dev/null 2>&1; then
              git fetch --no-tags origin "$FIXED_FRONTEND_SHA"
            fi
            test "$(git rev-parse --verify "$FIXED_FRONTEND_SHA^{commit}")" = "$FIXED_FRONTEND_SHA"
            FRONTEND_REPO="$RUNNER_TEMP/frontend-fixed"
            EXPECTED_FRONTEND_SHA="$FIXED_FRONTEND_SHA"
            git worktree add --detach "$FRONTEND_REPO" "$EXPECTED_FRONTEND_SHA"
          fi
          test "$(git -C "$FRONTEND_REPO" rev-parse HEAD)" = "$EXPECTED_FRONTEND_SHA"
          echo "FRONTEND_REPO=$FRONTEND_REPO" >> "$GITHUB_ENV"
          echo "EXPECTED_FRONTEND_SHA=$EXPECTED_FRONTEND_SHA" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install local database and browser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 redis-server iproute2
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
          npm ci --prefix .agents/skills/verify-where2meet/helpers
          cd .agents/skills/verify-where2meet/helpers
          npx --no-install playwright install --with-deps chrome
      - name: Test local and PPE ownership boundaries
        run: |
          python3 -m unittest discover -s .agents/skills/verify-where2meet/helpers -p 'test_*.py' -v
          node --test .agents/skills/verify-where2meet/helpers/test_ppe_browser.mjs .agents/skills/verify-where2meet/helpers/test_ppe_accounts_browser.mjs .agents/skills/verify-where2meet/helpers/test_places_browser.mjs .agents/skills/verify-where2meet/helpers/test_voting_browser.mjs
      - name: Run real frontend against compiled backend and migrated database
        run: |
          python3 .agents/skills/verify-where2meet/helpers/control.py launch --repo "$GITHUB_WORKSPACE" --frontend-repo "$FRONTEND_REPO" --run "$RUN_DIR"
          python3 .agents/skills/verify-where2meet/helpers/control.py drive --run "$RUN_DIR" --scenario "$BROWSER_SCENARIO"
      - name: Verify cancelled profile save and failed logout in the Settings component
        if: matrix.scenario == 'accounts'
        run: node .agents/skills/verify-where2meet/helpers/account-ui-races.mjs "$RUN_DIR"
      - name: Verify Secure session cookies on the loopback frontend
        if: matrix.scenario == 'accounts'
        run: node .agents/skills/verify-where2meet/helpers/account-cookie-proof.mjs "$RUN_DIR"
      - name: Verify PPE account cleanup against isolated PostgreSQL
        if: matrix.scenario == 'accounts'
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          from urllib.parse import urlsplit, urlunsplit
          import uuid

          state = json.loads((Path(os.environ["RUN_DIR"]) / "run.json").read_text())
          original = urlsplit(state["database_url"])
          if original.hostname != "127.0.0.1":
              raise SystemExit("Cleanup tests require the owned loopback cluster")
          database = "w2m_ppe_accounts_test_" + uuid.uuid4().hex
          test_url = urlunsplit(original._replace(path="/" + database, query=""))
          env = {**os.environ, "DATABASE_URL": test_url, "PPE_ACCOUNTS_TEST_DATABASE_URL": test_url}
          subprocess.run(["createdb", "--maintenance-db=" + state["database_url"], database], check=True)
          try:
              subprocess.run(["npm", "run", "db:migrate:deploy"], env=env,
                             cwd=Path(state["source_copy"]) / "server", check=True)
              subprocess.run([sys.executable, "-m", "unittest", "discover", "-s",
                              ".agents/skills/verify-where2meet/helpers", "-p", "test_ppe_accounts.py", "-v"],
                             env=env, check=True)
          finally:
              subprocess.run(["dropdb", "--maintenance-db=" + state["database_url"], database], check=True)
      - name: Save local failure diagnostics
        if: failure()
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          run = Path(os.environ["RUN_DIR"])
          state_path = run / "run.json"
          if state_path.exists():
              state = json.loads(state_path.read_text())
              summary = {key: state.get(key) for key in ("status", "schema_mode", "backend_mode", "ports")}
              summary["processes"] = {
                  name: {key: record.get(key) for key in ("pid", "identity")}
                  for name, record in state.get("processes", {}).items()
              }
              (run / "evidence" / "runner-state.json").write_text(json.dumps(summary, indent=2) + "\n")
      - name: Stop owned processes
        if: always()
        run: |
          if [ -f "$RUN_DIR/run.json" ]; then
            python3 .agents/skills/verify-where2meet/helpers/control.py cleanup --run "$RUN_DIR"
          fi
      - name: Require matching browser evidence and completed cleanup
        if: always()
        run: python3 .github/scripts/ci_policy.py evidence --evidence-dir "$RUN_DIR/evidence" --backend-sha "$GITHUB_SHA" --frontend-sha "$EXPECTED_FRONTEND_SHA" --scenario "$BROWSER_SCENARIO"
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-browser-${{ matrix.frontend }}-${{ matrix.scenario }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.RUN_DIR }}/evidence/*.json
            ${{ env.RUN_DIR }}/evidence/*.log
            ${{ env.RUN_DIR }}/evidence/*.png
            ${{ env.RUN_DIR }}/evidence/*.aria.txt
          if-no-files-found: error
          retention-days: 7
