name: Workflow validation

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/scripts/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/scripts/**'

permissions:
  contents: read

concurrency:
  group: workflow-lint-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test CI policy boundaries
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s .github/scripts -p 'test_*policy.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test staging browser safety boundaries
        run: node --test .agents/skills/verify-where2meet/helpers/test_staging_browser.mjs
      - name: Validate workflows and embedded scripts
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
