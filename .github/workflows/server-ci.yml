name: Server CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'client/**'
      - '.agents/skills/verify-where2meet/**'
      - '.github/workflows/**'
      - '.github/scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.husky/**'
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: server-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: server

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/where2meet

      - name: Check all TypeScript
        run: npm run type-check

      - name: Check module boundaries
        run: npm run check:boundaries

      - name: Test migration fixture boundaries
        run: node --test ../.agents/skills/verify-where2meet/helpers/test_migration_fixture.mjs ../.agents/skills/verify-where2meet/helpers/test_migration_remote.mjs

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/where2meet

      - name: Build Railway image
        run: docker build --tag where2meet-server:ci .

  test:
    name: Test (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres: ['17', '18']

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: where2meet
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d where2meet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8.2-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5434/where2meet?schema=public

      - name: Apply database migrations
        run: npm run db:migrate:deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5434/where2meet?schema=public

      - name: Run tests
        run: npm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5434/where2meet?schema=public
          REDIS_URL: redis://localhost:6380
          NODE_ENV: test

  client:
    uses: ./.github/workflows/client-ci.yml

  browser-compat:
    uses: ./.github/workflows/backend-compat-ci.yml

  workflow-lint:
    uses: ./.github/workflows/workflow-lint.yml

  required:
    name: CI required
    if: always()
    needs: [lint, build, test, client, browser-compat, workflow-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require every workload to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 .github/scripts/ci_policy.py gate --needs-json "$NEEDS_JSON"
